# cpplint settings for the game's own code. ./mk.sh lint runs cpplint over src/ with these.
#
# Version: cpplint 2.0.2 (the cpplint/cpplint fork on PyPI); mk.sh checks it. Another version
# reports different findings.
#
# Every category is on: Google style is the target (.clang-format is BasedOnStyle: Google), and
# cpplint checks what clang-format and clang-tidy don't. A category is turned off here only when
# its findings contradict clang-format's output, with the reason beside it.
#
# Exclusions are per directory, because cpplint matches exclude_files against the path component
# directly under the CPPLINT.cfg that names it: see the CPPLINT.cfg files under src/.
set noparent
# .clang-format's ColumnLimit (Google's 80).
linelength=80
extensions=c,cpp,h,hpp
headers=h,hpp
